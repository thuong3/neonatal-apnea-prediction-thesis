# preprocessing parameters
dataset_mode: list
# BA: Robin cohort restricted to CENTRAL apnea only, to match the CPAP
# cohort's event definition (which has central apnea and nothing else). This
# removes the second confounder from the cross-cohort comparison: with
# config/experiment/no_np.yaml the channel sets match too, so a remaining
# performance gap can only come from cohort/signal quality, not from event
# type or channels. See Section 4.5 of the thesis.
adverse_events:
  - APNEA-CENTRAL
# The other scored events MUST be cut out rather than ignored. If they were
# left in, an obstructive apnea or a hypopnea would sit inside a "control"
# window and be labelled as normal breathing -- precisely the events the
# original study shows to be predictable, which would poison the negatives.
# Residual limitation: `away` is computed on central apneas only, so a control
# window can still abut (though never overlap) an obstructive event.
cutter_events:
  - ACTIVITY-MOVE
  - APNEA-OBSTRUCTIVE
  - APNEA-MIXED
  - HYPOPNEA-OBSTRUCTIVE
  - HYPOPNEA-CENTRAL
  - HYPOPNEA-MIXED
signal_types:
  - NP
  - Thorax
  - HR
  - PR
  - SpO2
  - PCO2
time_window: 6000 # 30s -> 30 * 200
lag: 3000 # 15s -> 15 * 200
away: 36000 # 3min -> 3 * 60 * 200
standardize: standard
downsample: none

# NOT drift-corrected: the clock skew was measured on the CPAP/Embla export
# only. This cohort's patient ids overlap that one's (001-015), so leaving this
# unset -- rather than inheriting a default -- is what stops one cohort's
# coefficients being applied to the other's recordings.
clock_drift_file: null
