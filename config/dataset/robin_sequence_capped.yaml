# BA control experiment for the central-apnea comparison.
#
# Identical to config/dataset/robin_sequence.yaml (ALL apnea/hypopnea subtypes
# -- the task that reaches ~0.76-0.80) except that the positive windows are
# thinned per patient to exactly the counts the central-apnea-only run
# produced (config/dataset/robin_sequence_central.yaml, measured with
# scripts/count_windows.py). Same 15 patients as that run.
#
# Purpose: the central-only run changed TWO things at once -- the event type
# and the number of positives (~1700 -> 272). This config changes only the
# second. Comparing the three tells them apart:
#   all subtypes, ~1700 pos  -> 0.764  (robin_sequence)
#   all subtypes,   272 pos  -> ?      (this file)
#   central only,   272 pos  -> 0.564  (robin_sequence_central)
# If this run stays near 0.76 the drop is caused by the event type; if it
# falls to ~0.60 it is caused by data scarcity.
ids:
  - "001"
  - "002"
  - "004"
  - "006"
  - "007"
  - "008"
  - "010"
  - "011"
  - "012"
  - "013"
  - "015"
  - "016"
  - "017"
  - "018"
  - "019"

# preprocessing parameters
dataset_mode: list
adverse_events:
  - APNEA-OBSTRUCTIVE
  - APNEA-CENTRAL
  - APNEA-MIXED
  - HYPOPNEA-OBSTRUCTIVE
  - HYPOPNEA-CENTRAL
  - HYPOPNEA-MIXED
cutter_events:
  - ACTIVITY-MOVE
signal_types:
  - NP
  - Thorax
  - HR
  - PR
  - SpO2
  - PCO2
time_window: 6000 # 30s -> 30 * 200
lag: 3000 # 15s -> 15 * 200
away: 36000 # 3min -> 3 * 60 * 200
standardize: standard
downsample: none

# Positive-window counts of the central-apnea-only run, per patient.
# A different random subset is drawn per training seed.
positive_cap:
  "001": 23
  "002": 34
  "004": 34
  "006": 9
  "007": 24
  "008": 16
  "010": 5
  "011": 16
  "012": 25
  "013": 45
  "015": 7
  "016": 10
  "017": 11
  "018": 7
  "019": 6

# NOT drift-corrected: the clock skew was measured on the CPAP/Embla export
# only. This cohort's patient ids overlap that one's (001-015), so leaving this
# unset -- rather than inheriting a default -- is what stops one cohort's
# coefficients being applied to the other's recordings.
clock_drift_file: null
